[workspace]
members = ["xtask"]
exclude = []
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.83.0"

[package]
name = "aspeed-ddk"
version = "0.1.0"
edition = "2021"

[features]
default = []
std = []
i2c_target = []
test-rsa = []
test-ecdsa = []
test-hmac = []
test-hash = []
spi_dma = []
spi_dma_write = []
spi_monitor = []

[dependencies]
ast1060-pac = { git = "https://github.com/AspeedTech-BMC/ast1060-pac.git", features = ["rt"] }
embedded-hal = { version = "1.0.0" }
embedded-hal-old = { git = "https://github.com/rust-embedded/embedded-hal.git", rev = "599d44fdc7e709cb9ae6580ec11c0b7f7f102", package = "embedded-hal" }
embedded-io = "0.6.1"
fugit = "0.3.7"
proposed-traits = { git = "https://github.com/rusty1968/proposed_traits.git", package = "proposed-traits", rev = "85641310df5a5276c67f81621b104322cff0286c" }
hex-literal = "0.4"
heapless = "0.8.0"
nb = "1.1.0"
paste = "1.0"

openprot-hal-blocking = { git="https://github.com/OpenPRoT/openprot" }
zerocopy = { version = "0.8.25", features = ["derive"] }

cortex-m = { version = "0.7.5" }
cortex-m-rt = { version = "0.6.5", features = ["device"] }
panic-halt = "1.0.0"

# Profile for GDB debugging - disables optimizations for better debugging experience
[profile.dev]
opt-level = 0           # No optimizations
debug = true            # Full debug info
debug-assertions = true # Enable debug assertions
overflow-checks = true  # Enable overflow checks
lto = false            # No link-time optimization
codegen-units = 16     # Faster compilation

# Profile for hardware testing with GDB - minimal optimizations, full debug info
[profile.gdb-test]
inherits = "dev"
opt-level = 1          # Minimal optimizations (helps with some embedded issues)
debug = 2              # Full debug info with all details
strip = false          # Don't strip symbols

# Standard release profile
[profile.release]
opt-level = "z"        # Optimize for size
debug = false          # No debug info
lto = true             # Enable link-time optimization
codegen-units = 1      # Better optimization
strip = true           # Strip symbols
panic = "abort"        # Abort on panic for smaller binary

